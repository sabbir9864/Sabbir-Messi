<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | M. Sabbir Official</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #08090d;
    color: white;
}

/* HEADER */

header {
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: white;
    text-decoration: none;
}

nav {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

nav a {
    color: #aaa;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    color: white;
}

/* MAIN */

main {
    min-height: 80vh;
    padding: 80px 7%;
    text-align: center;
}

h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 50px;
}

/* GALLERY */

.gallery {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.photo {
    height: 280px;
    border-radius: 16px;
    overflow: hidden;
    background: #101218;
    border: 1px solid #242630;
    transition: 0.3s;
}

.photo:hover {
    transform: translateY(-7px);
    border-color: #666;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 30px;
    color: #666;
    border-top: 1px solid #222;
}

/* MOBILE */

@media (max-width: 750px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }

    h1 {
        font-size: 38px;
    }
}

@media (max-width: 500px) {

    .gallery {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<header>

    <a href="index.html" class="logo">
        M. SABBIR OFFICIAL
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="gaming.html">Gaming</a>
        <a href="gallery.html">Gallery</a>
        <a href="index.html#social">Social Media</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<main>

    <h1>My Gallery</h1>

    <p class="subtitle">
        My favorite photos and memorable moments 📸
    </p>


    <div class="gallery">

        <div class="photo">
            <img src="images/photo1.jpg" alt="Photo 1">
        </div>

        <div class="photo">
            <img src="images/photo2.jpg" alt="Photo 2">
        </div>

        <div class="photo">
            <img src="images/photo3.jpg" alt="Photo 3">
        </div>

    </div>

</main>


<footer>

    © 2026 M. SABBIR OFFICIAL. All Rights Reserved.

</footer>

</body>
</html>
